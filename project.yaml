project:
  namespace: "org.simplemodeling.textus"
  id: "Corpus"
  name: "textus-corpus"
  title: "Textus Corpus"
  kind: car
  scalaPackage: "org.simplemodeling.textus.corpus"
  component:
    name: "Corpus"
    className: "CorpusComponent"
    displayName: "Textus Corpus"
    version: "0.1.1"

build:
  scalaVersion: "3.3.8"
  cozyVersion: "0.3.2.2"
  dependencies:
    compile:
      - "org.goldenport::goldenport-cncf:0.5.2"
    test:
      - "org.scalatest::scalatest:3.2.19"

publication:
  source_manifest:
    enabled: false

packaging:
  kind: car
  car:
    abi:
      dependencies: []
    manifest_metadata:
      boundedContext: "corpus"
      domain: "corpus-management"
    runtime:
      cncf:
        minimum: "0.5.2"
        excluded: []
        tested:
          - "0.5.2"

warehouse:
  repository_artifacts:
    include:
      - car
    modules:
      - "textus-corpus"
